[package]
name = "app-net"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP client, source adapters (M3U first, Xtream next, Stalker last) and streaming importer"

[dependencies]
app-core.workspace = true
app-db.workspace = true
tokio.workspace = true
async-trait.workspace = true
futures-util.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
reqwest.workspace = true
rustls.workspace = true
url.workspace = true
once_cell = "1"
# XMLTV importer: streaming XML over tokio, gzip on the fly. `encoding` lets quick-xml honour
# `<?xml encoding="ISO-8859-1"?>` guides (encoding_rs is already in the tree).
quick-xml = { version = "0.42", features = ["async-tokio", "encoding"] }
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile = "3"
flate2 = "1"
