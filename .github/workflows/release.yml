name: release

# Builds installers for Windows (NSIS + MSI), macOS (.dmg, Apple Silicon + Intel) and Linux
# (.deb + .AppImage), signs the updater artifacts and publishes them as a GitHub release together
# with `latest.json` — which is what installed copies poll (plugins.updater.endpoints) and what the
# download page (site/) links to. See docs/RELEASING.md.
#
# Trigger: push a tag `v*` (e.g. `git tag v0.2.0 && git push --tags`) or run it by hand.
#
# Required secret: TAURI_SIGNING_PRIVATE_KEY (the minisign private key generated with
# `tauri signer generate`; its public half is in tauri.conf.json). Without it the build stops early.
#
# libmpv:
#   * Windows — scripts/fetch-libmpv.ps1 downloads libmpv-2.dll (shinchiro mpv-winbuild-cmake
#     releases, or $LIBMPV_DEV_URL / repo variable LIBMPV_DEV_URL to pin one) into src-tauri/lib,
#     which tauri.conf.json bundles as a resource.
#   * macOS — scripts/fetch-libmpv-macos.sh copies Homebrew's libmpv + deps into src-tauri/lib and
#     rewrites install names (@loader_path). Unsigned: users right-click → Open on first launch
#     until APPLE_* signing secrets are configured (see tauri-action docs).
#   * Linux — .deb depends on libmpv2; AppImage users need libmpv2 installed (loaded at runtime).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: ""
          - name: macos-arm64
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-15-intel
            args: "--target x86_64-apple-darwin"
            target: x86_64-apple-darwin
          - name: linux-x64
            os: ubuntu-22.04
            args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config libssl-dev patchelf \
            libmpv-dev

      - name: libmpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LIBMPV_DEV_URL: ${{ vars.LIBMPV_DEV_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-libmpv.ps1

      - name: libmpv (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install mpv
          ./scripts/fetch-libmpv-macos.sh

      - name: Frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Updater signing key present?
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is not set. Add it under Settings → Secrets and variables → Actions (docs/RELEASING.md), then re-run."
            exit 1
          fi

      # Windows code signing through Azure Artifact Signing (formerly Trusted Signing). Only active
      # when the AZURE_* secrets exist (docs/RELEASING.md § Code signing); otherwise the build is
      # unsigned and SmartScreen warns once. Uses Microsoft's own signtool dlib
      # (Microsoft.ArtifactSigning.Client from NuGet) authenticated through EnvironmentCredential,
      # injected into tauri as a bundle.windows.signCommand config overlay so the committed
      # tauri.conf.json stays buildable on machines without the tooling.
      - name: Windows code signing (Azure Artifact Signing)
        if: runner.os == 'Windows'
        id: acs
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          if (-not $env:AZURE_CLIENT_ID -or -not $env:AZURE_SIGNING_ACCOUNT -or -not $env:AZURE_SIGNING_PROFILE) {
            Write-Host "AZURE_* secrets not set - building unsigned."
            "args=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $ErrorActionPreference = "Stop"
          $endpoint = if ($env:AZURE_SIGNING_ENDPOINT) { $env:AZURE_SIGNING_ENDPOINT } else { "https://eus.codesigning.azure.net" }
          $tools = Join-Path $env:RUNNER_TEMP "acs"
          New-Item -ItemType Directory -Force $tools | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.ArtifactSigning.Client" -OutFile "$tools\client.zip"
          Expand-Archive "$tools\client.zip" -DestinationPath "$tools\client" -Force
          $dlib = Get-ChildItem "$tools\client" -Recurse -Filter Azure.CodeSigning.Dlib.dll | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1 -ExpandProperty FullName
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dlib -or -not $signtool) { throw "dlib=$dlib signtool=$signtool" }
          Write-Host "signtool: $signtool"
          Write-Host "dlib:     $dlib"
          $meta = Join-Path $tools "metadata.json"
          @{
            Endpoint = $endpoint
            CodeSigningAccountName = $env:AZURE_SIGNING_ACCOUNT
            CertificateProfileName = $env:AZURE_SIGNING_PROFILE
            ExcludeCredentials = @("ManagedIdentityCredential","WorkloadIdentityCredential","SharedTokenCacheCredential","VisualStudioCredential","VisualStudioCodeCredential","AzureCliCredential","AzurePowerShellCredential","AzureDeveloperCliCredential","InteractiveBrowserCredential")
          } | ConvertTo-Json | Set-Content -Path $meta -Encoding utf8
          # Preflight: sign a throwaway copy of a system exe so a broken credential, role or endpoint
          # fails here with signtool's full output (tauri only logs it at debug level).
          $probe = Join-Path $env:RUNNER_TEMP "signprobe.exe"
          Copy-Item "$env:SystemRoot\System32\where.exe" $probe
          & $signtool sign /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib $dlib /dmdf $meta /d "SKTV sign probe" $probe
          if ($LASTEXITCODE -ne 0) { throw "signtool preflight failed (exit $LASTEXITCODE) - see output above" }
          $sig = Get-AuthenticodeSignature $probe
          Write-Host "Probe signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          $overlay = @{ bundle = @{ windows = @{ signCommand = @{
            cmd = $signtool
            args = @("sign","/fd","SHA256","/tr","http://timestamp.acs.microsoft.com","/td","SHA256","/dlib",$dlib,"/dmdf",$meta,"/d","SKTV","%1")
          } } } } | ConvertTo-Json -Depth 6 -Compress
          $path = Join-Path $env:RUNNER_TEMP "sign.conf.json"
          Set-Content -Path $path -Value $overlay -Encoding utf8
          Write-Host "Signing enabled via $signtool"
          "args=--config $path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build + package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing (required — see above):
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Windows code signing service principal (used by artifact-signing-cli when set):
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # macOS signing/notarization: when an Apple Developer certificate exists, add the
          # APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY / APPLE_ID /
          # APPLE_PASSWORD / APPLE_TEAM_ID secrets *and* list them here. They must not be listed
          # while unset: an empty APPLE_CERTIFICATE makes tauri try to import an empty keychain
          # certificate and the macOS bundle step fails.
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "SKTV ${{ github.ref_name }}"
          releaseBody: |
            Player-only IPTV client. This app does not provide channels, playlists, or stream URLs — you bring your own source. We do not support illegal services.

            * **Windows** — `SKTV_<version>_x64-setup.exe` (bundles libmpv; installs WebView2 if missing; replaces an older `desktop-iptv` install and keeps its data). If SmartScreen shows "Windows protected your PC", click *More info → Run anyway* (happens while a new signing certificate is still building reputation, or on unsigned builds).
            * **macOS** — `.dmg` for Apple Silicon (`aarch64`) and Intel (`x64`). Unsigned: after copying to Applications, open it once from System Settings → Privacy & Security → *Open Anyway*.
            * **Linux** — `.deb` (depends on libmpv2) or `.AppImage` (install libmpv2 with your package manager).

            Installed copies (including ones still called desktop-iptv) update themselves from this page (`latest.json`).
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }} ${{ steps.acs.outputs.args }}

      - name: Upload bundles (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: SKTV-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/*/release/bundle/**/*.dmg
