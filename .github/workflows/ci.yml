name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps (Tauri + libmpv + ffmpeg)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config libssl-dev \
            libmpv2 libmpv-dev ffmpeg
      - name: Core crates — clippy + tests
        run: |
          cargo clippy -p app-core -p app-db -p app-net -p app-engine -- -D warnings
          cargo test -p app-core -p app-db -p app-net -p app-engine
      - name: Import benchmark (20k channels)
        run: cargo run --release -p app-net --example bench_import -- 20000
      - name: App crate — check
        if: runner.os == 'Linux'
        run: cargo check -p desktop-iptv

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
