[workspace]
resolver = "2"
members = [
  "crates/app-core",
  "crates/app-db",
  "crates/app-net",
  "crates/app-engine",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
# runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
async-trait = "0.1"
futures-util = "0.3"
bytes = "1"

# serialization / errors / logging
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# data
rusqlite = { version = "0.40", features = ["bundled", "hooks", "functions"] }
unicode-normalization = "0.1"

# net
# rustls-no-provider + explicit ring: avoids the aws-lc-rs build chain (CMake/NASM) on Windows.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "gzip", "json", "charset", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
url = "2"

# license
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
machine-uid = "0.6"

# engine
libloading = "0.8"
raw-window-handle = "0.6"

# internal
app-core = { path = "crates/app-core" }
app-db = { path = "crates/app-db" }
app-net = { path = "crates/app-net" }
app-engine = { path = "crates/app-engine" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
