[package]
name = "desktop-iptv"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Player-only desktop IPTV client (Tauri v2 + Rust + libmpv + SQLite)"

[lib]
name = "desktop_iptv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
app-core.workspace = true
app-db.workspace = true
app-net.workspace = true
app-engine.workspace = true

tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
raw-window-handle.workspace = true

tokio.workspace = true
futures-util.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs = "7"
thiserror.workspace = true
url.workspace = true
sha2.workspace = true
hex.workspace = true
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"

[features]
# Tauri's dev/prod switch for the custom protocol; leave as is.
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
